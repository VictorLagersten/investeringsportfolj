name: Discover global equity universe

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover-universe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Discover broad global equity universe
        run: node scripts/discover-universe.mjs

      - name: Enrich discovered universe
        run: node scripts/enrich-universe.mjs

      - name: Commit universe
        run: |
          git config user.name "investern-bot"
          git config user.email "investern-bot@users.noreply.github.com"
          git add data/universe.json
          git diff --cached --quiet || git commit -m "Refresh global equity universe"
          git push
