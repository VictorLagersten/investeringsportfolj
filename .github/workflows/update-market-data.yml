name: Update market data

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-market-data
  cancel-in-progress: true

jobs:
  update-market-data:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch market data
        run: node scripts/update-market-data.mjs

      - name: Commit market data
        run: |
          git config user.name "investern-bot"
          git config user.email "investern-bot@users.noreply.github.com"
          git add data/market.json
          git diff --cached --quiet || git commit -m "Update market data"
          git push
