name: Portfolio integrity and missed trade-window guard
on:
  schedule:
    # Summer: 10:30 Stockholm = 08:30 UTC. Winter: 10:30 Stockholm = 09:30 UTC.
    - cron: "30 8 * * 2,5"
    - cron: "30 9 * * 2,5"
  push:
    paths:
      - 'scripts/portfolio-integrity.mjs'
      - 'scripts/test-portfolio-integrity.mjs'
      - '.github/workflows/portfolio-integrity.yml'
      - 'README.md'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: portfolio-integrity-main
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regression-test missed-window handling
        run: node scripts/test-portfolio-integrity.mjs
      - name: Validate, reconcile, and safely publish audit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            echo "Audit/publish attempt $attempt"
            git fetch origin main
            git reset --hard origin/main
            audit_exit=0
            node scripts/portfolio-integrity.mjs || audit_exit=$?
            git add data/portfolio-integrity.json data/portfolio-journal.json
            git diff --cached --quiet || git commit -m "Audit portfolio integrity and trade window"
            if git push origin HEAD:main; then
              exit "$audit_exit"
            fi
            echo "Push race detected; re-fetching latest main and recomputing audit."
            sleep 2
          done
          echo "Could not publish audit after three attempts."
          exit 1
